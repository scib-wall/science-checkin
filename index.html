<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Class Reflections & Realm Quests</title>
  
  <!-- Enhanced Retro Pixel Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;600;700&family=VT323&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Canvas Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --mc-dark-border: #141414;
      --mc-light-border: #4a4a4a;
      --mc-gold: #fbc02d;
    }

    body {
      font-family: 'Pixelify Sans', cursive, sans-serif;
      font-size: 1.2rem;
      background-color: #0d0f12;
      overflow-x: hidden;
      color: #e2e8f0;
    }

    /* Ambient Animated Grid Background */
    #bgCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      pointer-events: none;
    }

    h1, h2, label, button, .mc-font {
      font-family: 'Press Start 2P', cursive;
      letter-spacing: 0.5px;
    }

    /* Enhanced Minecraft Beveled Borders */
    .mc-box {
      background-color: #262423;
      border: 4px solid #000;
      box-shadow: 
        inset 4px 4px 0px #3d3a37,
        inset -4px -4px 0px #171615,
        0 10px 25px -5px rgba(0, 0, 0, 0.7);
      position: relative;
    }

    .mc-slot {
      background-color: #121111;
      border: 3px solid #000;
      box-shadow: 
        inset -3px -3px 0px #32302e,
        inset 3px 3px 0px #0a0909;
    }

    /* Action Buttons */
    .mc-button {
      background-color: #059669;
      border: 3px solid #000;
      box-shadow: 
        inset -3px -3px 0px #047857,
        inset 3px 3px 0px #34d399,
        0 4px 0px #000;
      text-shadow: 2px 2px 0px #000;
      transition: all 0.1s ease;
    }

    .mc-button:hover {
      background-color: #10b981;
      transform: translateY(-2px);
      box-shadow: 
        inset -3px -3px 0px #059669,
        inset 3px 3px 0px #6ee7b7,
        0 6px 0px #000;
    }

    .mc-button:active {
      transform: translateY(2px);
      box-shadow: 
        inset 3px 3px 0px #047857,
        inset -3px -3px 0px #34d399,
        0 2px 0px #000;
    }

    .mc-button-secondary {
      background-color: #475569;
      box-shadow: 
        inset -3px -3px 0px #334155,
        inset 3px 3px 0px #94a3b8,
        0 4px 0px #000;
    }
    
    .mc-button-secondary:hover {
      background-color: #64748b;
      box-shadow: 
        inset -3px -3px 0px #475569,
        inset 3px 3px 0px #cbd5e1,
        0 6px 0px #000;
    }

    /* Text & Input Enhancements */
    input, textarea {
      font-family: 'Pixelify Sans', sans-serif !important;
      font-size: 1.25rem !important;
      color: #f8fafc !important;
      text-shadow: 1px 1px 0px #000;
      transition: all 0.2s ease;
    }

    input:focus, textarea:focus {
      box-shadow: 
        inset -3px -3px 0px #1e293b,
        inset 3px 3px 0px #0f172a,
        0 0 12px rgba(16, 185, 129, 0.4);
      border-color: #10b981 !important;
    }

    .pixel-text-shadow {
      text-shadow: 2px 2px 0px #000;
    }

    .glow-gold {
      text-shadow: 0 0 8px rgba(251, 192, 45, 0.6), 2px 2px 0px #000;
    }

    /* Dynamic Color Loop Span */
    .colored-letter {
      display: inline-block;
      text-shadow: 3px 3px 0px #000;
      transition: color 0.25s ease-in-out;
      will-change: color;
    }

    /* Animations */
    @keyframes pixelFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .float-icon {
      display: inline-block;
      animation: pixelFloat 2s ease-in-out infinite;
    }

    @keyframes fastSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .pixel-spinner {
      display: inline-block;
      animation: fastSpin 1s linear infinite;
    }

    @keyframes redstonePulse {
      0%, 100% { border-color: #ef4444; box-shadow: 0 0 10px rgba(239, 68, 68, 0.5); }
      50% { border-color: #f59e0b; box-shadow: 0 0 15px rgba(245, 158, 11, 0.7); }
    }
    .glowing-border-active {
      animation: redstonePulse 0.6s infinite ease-in-out;
    }
  </style>
</head>
<body class="py-6 sm:py-10 px-3 sm:px-6">

  <!-- Floating Pixel Background Canvas -->
  <canvas id="bgCanvas"></canvas>

  <div class="max-w-2xl mx-auto space-y-6 sm:space-y-8 relative z-10">
    
    <!-- Banner Header -->
    <header class="text-center">
      <div class="bg-gradient-to-b from-emerald-800 to-emerald-950 mc-box p-4 sm:p-6 rounded-none w-full border-b-8">
        <h1 class="text-base sm:text-2xl font-bold leading-relaxed tracking-wider">
          <span class="float-icon">⛏️</span> 
          <span id="randomTitle">CLASS REFLECTIONS</span> 
          <span class="float-icon" style="animation-delay: 0.5s;">💎</span>
        </h1>
        <p class="text-emerald-200 text-lg sm:text-xl mt-2 font-semibold tracking-wide pixel-text-shadow">
          Build your quest goals & craft your school year!
        </p>
      </div>
    </header>

    <!-- Main Reflection Form -->
    <main class="mc-box p-5 sm:p-8 shadow-2xl">
      <form id="checkinForm" onsubmit="handleFormSubmit(event)" class="space-y-6">
        
        <!-- Gamertag / Name -->
        <div class="space-y-2">
          <label class="block text-[11px] sm:text-xs text-yellow-400 leading-relaxed glow-gold">
            🏷️ GAMERTAG / NAME:
          </label>
          <div class="mc-slot p-1">
            <input type="text" id="studentName" required 
              class="w-full px-3 py-2 bg-stone-900 border-2 border-stone-700 text-emerald-400 focus:outline-none"
              placeholder="e.g., Steve_99 or Alex">
          </div>
        </div>

        <!-- Quest Goal -->
        <div class="space-y-2">
          <label class="block text-[11px] sm:text-xs text-emerald-400 leading-relaxed pixel-text-shadow">
            💎 1. MAIN QUEST: WHAT IS ONE BIG GOAL YOU WANT TO ACHIEVE THIS YEAR?
          </label>
          <div class="mc-slot p-1">
            <textarea id="goal" rows="3" required 
              class="w-full px-3 py-2 bg-stone-900 border-2 border-stone-700 text-slate-100 focus:outline-none"
              placeholder="My main quest is to..."></textarea>
          </div>
        </div>

        <!-- Worry / Hazard -->
        <div class="space-y-2">
          <label class="block text-[11px] sm:text-xs text-red-400 leading-relaxed pixel-text-shadow">
            💥 2. HAZARD WARNING: WHAT IS ONE THING WEIGHING ON YOUR MIND?
          </label>
          <div class="mc-slot p-1">
            <textarea id="worry" rows="3" required 
              class="w-full px-3 py-2 bg-stone-900 border-2 border-stone-700 text-slate-100 focus:outline-none"
              placeholder="I'm worried about..."></textarea>
          </div>
        </div>

        <!-- Teacher Advice / Buff -->
        <div class="space-y-2">
          <label class="block text-[11px] sm:text-xs text-sky-400 leading-relaxed pixel-text-shadow">
            🧪 3. TEACHER BUFFS: WHAT CAN TEACHERS DO TO HELP YOU CRAFT SUCCESS?
          </label>
          <div class="mc-slot p-1">
            <textarea id="teacherTip" rows="3" required 
              class="w-full px-3 py-2 bg-stone-900 border-2 border-stone-700 text-slate-100 focus:outline-none"
              placeholder="Teachers can help by..."></textarea>
          </div>
        </div>

        <!-- Submit Button -->
        <div class="pt-2">
          <button type="submit" id="submitBtn" 
            class="w-full py-4 text-white font-bold text-[11px] sm:text-xs mc-button cursor-pointer leading-normal tracking-wider">
            [ CRAFT & SUBMIT REFLECTION ]
          </button>
        </div>
      </form>
      
      <!-- Auto-fading Status Message -->
      <div id="statusMessage" class="hidden mt-6 text-center text-xs mc-font transition-opacity duration-500 glow-gold"></div>
    </main>

    <!-- Community Billboard / Spotlight -->
    <section class="mc-box p-5 sm:p-8 space-y-5">
      <div class="flex flex-col sm:flex-row items-center justify-between border-b-4 border-stone-700 pb-4 gap-4">
        <div class="text-center sm:text-left">
          <h2 class="text-xs sm:text-base font-bold text-yellow-400 glow-gold">📜 REALM BULLETIN</h2>
          <p class="text-stone-300 text-sm sm:text-base mt-1 font-semibold">Insights shared by fellow players!</p>
        </div>
        <button id="shuffleBtn" onclick="loadSpotlight()" 
          class="w-full sm:w-auto px-5 py-2.5 text-[10px] sm:text-xs text-yellow-300 mc-button mc-button-secondary mc-font">
          🔄 RESHUFFLE
        </button>
      </div>

      <div id="spotlightContainer" class="space-y-4">
        <p class="text-stone-400 text-center italic">Craft your entry above to display on the board!</p>
      </div>
    </section>

  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbztNuhGhOYB-9xb34sz3tT2kgZGj53bP3-ZT8bfCZzABfJAxJq9Bi4y3Lm4LlpDsIJT/exec";
    let statusTimeout;

    // Palette for Title Dynamic Animation
    const pixelColors = [
      '#fde047', '#f43f5e', '#38bdf8', '#4ade80', 
      '#fb923c', '#a855f7', '#f472b6', '#34d399'
    ];

    function initializeTitleSpans() {
      const titleEl = document.getElementById('randomTitle');
      const text = titleEl.innerText;
      titleEl.innerHTML = '';

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        if (char === ' ') {
          titleEl.appendChild(document.createTextNode(' '));
        } else {
          const span = document.createElement('span');
          span.className = 'colored-letter';
          span.innerText = char;
          span.style.color = pixelColors[Math.floor(Math.random() * pixelColors.length)];
          titleEl.appendChild(span);
        }
      }
    }

    function startTitleColorLoop() {
      setInterval(() => {
        const spans = document.querySelectorAll('#randomTitle .colored-letter');
        spans.forEach(span => {
          const randomColor = pixelColors[Math.floor(Math.random() * pixelColors.length)];
          span.style.color = randomColor;
        });
      }, 500);
    }

    // Ambient Particle Background Script
    function initBackgroundCanvas() {
      const canvas = document.getElementById('bgCanvas');
      const ctx = canvas.getContext('2d');
      let width = canvas.width = window.innerWidth;
      let height = canvas.height = window.innerHeight;

      const particles = Array.from({ length: 35 }, () => ({
        x: Math.random() * width,
        y: Math.random() * height,
        size: Math.random() * 4 + 2,
        speedY: -(Math.random() * 0.4 + 0.1),
        opacity: Math.random() * 0.5 + 0.2,
        color: ['#10b981', '#f59e0b', '#3b82f6'][Math.floor(Math.random() * 3)]
      }));

      function animate() {
        ctx.clearRect(0, 0, width, height);
        particles.forEach(p => {
          p.y += p.speedY;
          if (p.y < -10) {
            p.y = height + 10;
            p.x = Math.random() * width;
          }
          ctx.fillStyle = p.color;
          ctx.globalAlpha = p.opacity;
          ctx.fillRect(Math.floor(p.x), Math.floor(p.y), p.size, p.size);
        });
        requestAnimationFrame(animate);
      }

      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      animate();
    }

    function handleFormSubmit(event) {
      event.preventDefault();
      
      const btn = document.getElementById('submitBtn');
      const statusMsg = document.getElementById('statusMessage');
      
      clearTimeout(statusTimeout);

      btn.disabled = true;
      btn.innerText = "[ CRAFTING RESPONSE... ]";
      btn.classList.add('glowing-border-active');

      const payload = {
        studentName: document.getElementById('studentName').value,
        goal: document.getElementById('goal').value,
        worry: document.getElementById('worry').value,
        teacherTip: document.getElementById('teacherTip').value
      };

      fetch(API_URL, {
        method: "POST",
        mode: "no-cors", 
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      })
      .then(() => {
        btn.classList.remove('glowing-border-active');
        btn.disabled = false;
        btn.innerText = "[ CRAFT & SUBMIT REFLECTION ]";
        document.getElementById('checkinForm').reset();
        
        statusMsg.className = "mt-6 text-center text-xs text-emerald-400 mc-font leading-relaxed opacity-100 glow-gold";
        statusMsg.innerText = "🎉 ADVANCEMENT MADE! REFLECTION CRAFTED!";
        statusMsg.classList.remove('hidden');

        fireConfetti();
        setTimeout(loadSpotlight, 1200);

        statusTimeout = setTimeout(() => {
          statusMsg.classList.add('opacity-0');
          setTimeout(() => statusMsg.classList.add('hidden'), 500);
        }, 5000);
      })
      .catch(err => {
        console.error(err);
        btn.classList.remove('glowing-border-active');
        btn.disabled = false;
        btn.innerText = "[ CRAFT & SUBMIT REFLECTION ]";
        statusMsg.className = "mt-6 text-center text-xs text-red-400 mc-font leading-relaxed opacity-100";
        statusMsg.innerText = "❌ CRAFTING FAILED! TRY AGAIN!";
        statusMsg.classList.remove('hidden');

        statusTimeout = setTimeout(() => {
          statusMsg.classList.add('opacity-0');
          setTimeout(() => statusMsg.classList.add('hidden'), 500);
        }, 5000);
      });
    }

    function fireConfetti() {
      confetti({
        particleCount: 70,
        spread: 70,
        shapes: ['square'],
        colors: ['#10b981', '#f59e0b', '#ef4444', '#3b82f6', '#8b5cf6'],
        origin: { y: 0.6 }
      });
    }

    function loadSpotlight() {
      const container = document.getElementById('spotlightContainer');
      const shuffleBtn = document.getElementById('shuffleBtn');
      
      shuffleBtn.disabled = true;
      shuffleBtn.innerText = "⏳ SHUFFLING...";
      
      container.innerHTML = `
        <div class="py-8 text-center space-y-3">
          <div class="text-3xl pixel-spinner">⚙️</div>
          <p class="text-xs text-yellow-300 mc-font glow-gold">SHUFFLING THOUGHTS...</p>
        </div>
      `;
      
      fetch(API_URL)
        .then(res => res.json())
        .then(data => {
          shuffleBtn.disabled = false;
          shuffleBtn.innerText = "🔄 RESHUFFLE";

          if (!data) {
            container.innerHTML = '<p class="text-stone-400 text-center">No player notes found yet!</p>';
            return;
          }

          container.innerHTML = `
            <div class="mc-slot p-4 space-y-2 border-l-4 border-l-emerald-500">
              <span class="text-xs text-emerald-400 mc-font pixel-text-shadow">💎 MAIN QUEST:</span>
              <p class="text-slate-100 text-lg sm:text-xl leading-relaxed">"${data.goal.text}"</p>
              <span class="text-sm text-stone-400 block text-right font-semibold">— Player: ${data.goal.name}</span>
            </div>

            <div class="mc-slot p-4 space-y-2 border-l-4 border-l-red-500">
              <span class="text-xs text-red-400 mc-font pixel-text-shadow">💥 HAZARD WARNING:</span>
              <p class="text-slate-100 text-lg sm:text-xl leading-relaxed">"${data.worry.text}"</p>
              <span class="text-sm text-stone-400 block text-right font-semibold">— Player: ${data.worry.name}</span>
            </div>

            <div class="mc-slot p-4 space-y-2 border-l-4 border-l-sky-500">
              <span class="text-xs text-sky-400 mc-font pixel-text-shadow">🧪 TEACHER BUFF:</span>
              <p class="text-slate-100 text-lg sm:text-xl leading-relaxed">"${data.tip.text}"</p>
              <span class="text-sm text-stone-400 block text-right font-semibold">— Player: ${data.tip.name}</span>
            </div>
          `;
        })
        .catch(err => {
          shuffleBtn.disabled = false;
          shuffleBtn.innerText = "🔄 RESHUFFLE";
          console.error("Error fetching spotlight data:", err);
          container.innerHTML = '<p class="text-red-400 text-center text-xs mc-font">FAILED TO LOAD REFLECTIONS</p>';
        });
    }

    window.onload = function() {
      initializeTitleSpans();
      startTitleColorLoop();
      initBackgroundCanvas();
      loadSpotlight();
    };
  </script>
</body>
</html>
