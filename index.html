<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Class Reflections & Realm Quests</title>
  
  <!-- Retro Pixel Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Canvas Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    body {
      font-family: 'VT323', monospace;
      font-size: 1.25rem;
      background-color: #1a1a1a;
      background-image: radial-gradient(#2d3748 1px, transparent 0);
      background-size: 16px 16px;
      overflow-x: hidden;
    }
    
    @media (min-width: 640px) {
      body {
        font-size: 1.35rem;
      }
    }

    h1, h2, label, button, .mc-font {
      font-family: 'Press Start 2P', cursive;
    }

    /* Pixelated Sharp Borders */
    .mc-button {
      box-shadow: inset -3px -3px 0px 0px #1e293b, inset 3px 3px 0px 0px #94a3b8;
      image-rendering: pixelated;
    }

    .mc-box {
      border: 4px solid #000;
      box-shadow: inset -4px -4px 0px #1c1917, inset 4px 4px 0px #57534e;
    }

    /* Lightweight GPU-Accelerated Redstone Pulse Border */
    @keyframes redstonePulse {
      0%, 100% { border-color: #ef4444; }
      50% { border-color: #f59e0b; }
    }

    .glowing-border-active {
      animation: redstonePulse 0.6s infinite ease-in-out;
      will-change: border-color;
    }

    /* Smooth Floating Icons (GPU accelerated) */
    @keyframes pixelFloat {
      0%, 100% { transform: translate3d(0, 0, 0); }
      50% { transform: translate3d(0, -5px, 0); }
    }
    .float-icon {
      display: inline-block;
      animation: pixelFloat 1.8s ease-in-out infinite;
      will-change: transform;
    }

    /* Fast 60fps Spinner */
    @keyframes fastSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .pixel-spinner {
      display: inline-block;
      animation: fastSpin 1s linear infinite;
      will-change: transform;
    }

    /* Dynamic Letter Span Styling with Smooth Color Transitions */
    .colored-letter {
      display: inline-block;
      text-shadow: 2px 2px 0px #000;
      transition: color 0.25s linear;
      will-change: color;
    }
  </style>
</head>
<body class="text-slate-100 min-h-screen py-4 sm:py-8 px-3 sm:px-6">

  <div class="max-w-2xl mx-auto space-y-6 sm:space-y-8">
    
    <!-- Header Banner -->
    <header class="text-center space-y-3">
      <div class="inline-block bg-emerald-800 mc-box border-b-6 sm:border-b-8 border-emerald-950 p-3 sm:p-4 rounded-none w-full">
        <h1 class="text-sm sm:text-xl font-bold leading-relaxed">
          <span class="float-icon">⛏️</span> 
          <span id="randomTitle">CLASS REFLECTIONS</span> 
          <span class="float-icon" style="animation-delay: 0.5s;">💎</span>
        </h1>
        <p class="text-emerald-100 text-base sm:text-lg mt-1 sm:mt-2 font-mono">Build your quest goals & craft your school year!</p>
      </div>
    </header>

    <!-- Main Reflection Form -->
    <main class="bg-stone-800 mc-box p-4 sm:p-8 shadow-2xl">
      <form id="checkinForm" onsubmit="handleFormSubmit(event)" class="space-y-5 sm:space-y-6">
        
        <!-- Gamertag / Name -->
        <div>
          <label class="block text-[10px] sm:text-xs text-yellow-400 mb-2 leading-relaxed">🏷️ GAMERTAG / NAME:</label>
          <input type="text" id="studentName" required 
            class="w-full px-3 py-2 bg-stone-900 border-2 sm:border-4 border-stone-600 text-green-400 focus:outline-none focus:border-emerald-500 font-mono text-lg sm:text-xl"
            placeholder="Steve_99 or Alex">
        </div>

        <!-- Quest Goal -->
        <div>
          <label class="block text-[10px] sm:text-xs text-emerald-400 mb-2 leading-relaxed">💎 1. MAIN QUEST: WHAT IS ONE BIG GOAL YOU WANT TO ACHIEVE THIS YEAR?</label>
          <textarea id="goal" rows="3" required 
            class="w-full px-3 py-2 bg-stone-900 border-2 sm:border-4 border-stone-600 text-slate-100 focus:outline-none focus:border-emerald-500 font-mono text-lg sm:text-xl"
            placeholder="My main quest is to..."></textarea>
        </div>

        <!-- Worry / Hazard -->
        <div>
          <label class="block text-[10px] sm:text-xs text-red-400 mb-2 leading-relaxed">💥 2. HAZARD WARNING: WHAT IS ONE THING WEIGHING ON YOUR MIND?</label>
          <textarea id="worry" rows="3" required 
            class="w-full px-3 py-2 bg-stone-900 border-2 sm:border-4 border-stone-600 text-slate-100 focus:outline-none focus:border-red-500 font-mono text-lg sm:text-xl"
            placeholder="I'm worried about..."></textarea>
        </div>

        <!-- Teacher Advice / Buff -->
        <div>
          <label class="block text-[10px] sm:text-xs text-sky-400 mb-2 leading-relaxed">🧪 3. TEACHER BUFFS: WHAT CAN TEACHERS DO TO HELP YOU CRAFT SUCCESS?</label>
          <textarea id="teacherTip" rows="3" required 
            class="w-full px-3 py-2 bg-stone-900 border-2 sm:border-4 border-stone-600 text-slate-100 focus:outline-none focus:border-sky-500 font-mono text-lg sm:text-xl"
            placeholder="Teachers can help by..."></textarea>
        </div>

        <!-- Submit Button Container -->
        <div>
          <button type="submit" id="submitBtn" 
            class="w-full py-3 sm:py-4 bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white font-bold text-[10px] sm:text-xs border-2 sm:border-4 border-black mc-button cursor-pointer transition leading-normal">
            [ CRAFT & SUBMIT REFLECTION ]
          </button>
        </div>
      </form>
      
      <!-- Auto-fading Status Message -->
      <div id="statusMessage" class="hidden mt-4 sm:mt-6 text-center text-[10px] sm:text-xs mc-font transition-opacity duration-500"></div>
    </main>

    <!-- Community Billboard / Spotlight -->
    <section class="bg-stone-800 mc-box p-4 sm:p-8 space-y-4 sm:space-y-6">
      <div class="flex flex-col sm:flex-row items-center justify-between border-b-2 sm:border-b-4 border-stone-700 pb-3 sm:pb-4 gap-3">
        <div class="text-center sm:text-left">
          <h2 class="text-xs sm:text-base font-bold text-yellow-400">📜 REALM BULLETIN</h2>
          <p class="text-slate-400 text-xs sm:text-sm">Insights shared by fellow players!</p>
        </div>
        <button id="shuffleBtn" onclick="loadSpotlight()" 
          class="w-full sm:w-auto px-4 py-2 bg-stone-700 hover:bg-stone-600 text-[10px] sm:text-xs text-yellow-300 border-2 border-black mc-button mc-font transition">
          🔄 RESHUFFLE
        </button>
      </div>

      <div id="spotlightContainer" class="space-y-3 sm:space-y-4">
        <p class="text-slate-400 text-center italic">Craft your entry above to display on the board!</p>
      </div>
    </section>

  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbztNuhGhOYB-9xb34sz3tT2kgZGj53bP3-ZT8bfCZzABfJAxJq9Bi4y3Lm4LlpDsIJT/exec";
    let statusTimeout;

    // Vibrant Retro Palette for Title Randomization
    const pixelColors = [
      '#fde047', '#f43f5e', '#38bdf8', '#4ade80', 
      '#fb923c', '#a855f7', '#f472b6', '#34d399'
    ];

    // Initial setup: convert text into individual span tags
    function initializeTitleSpans() {
      const titleEl = document.getElementById('randomTitle');
      const text = titleEl.innerText;
      titleEl.innerHTML = '';

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        if (char === ' ') {
          titleEl.appendChild(document.createTextNode(' '));
        } else {
          const span = document.createElement('span');
          span.className = 'colored-letter';
          span.innerText = char;
          span.style.color = pixelColors[Math.floor(Math.random() * pixelColors.length)];
          titleEl.appendChild(span);
        }
      }
    }

    // Updates letter colors every 0.5s smoothly
    function startTitleColorLoop() {
      setInterval(() => {
        const spans = document.querySelectorAll('#randomTitle .colored-letter');
        spans.forEach(span => {
          const randomColor = pixelColors[Math.floor(Math.random() * pixelColors.length)];
          span.style.color = randomColor;
        });
      }, 500); // 500ms = 0.5 seconds
    }

    function handleFormSubmit(event) {
      event.preventDefault();
      
      const btn = document.getElementById('submitBtn');
      const statusMsg = document.getElementById('statusMessage');
      
      clearTimeout(statusTimeout);

      btn.disabled = true;
      btn.innerText = "[ CRAFTING RESPONSE... ]";
      btn.classList.add('glowing-border-active');

      const payload = {
        studentName: document.getElementById('studentName').value,
        goal: document.getElementById('goal').value,
        worry: document.getElementById('worry').value,
        teacherTip: document.getElementById('teacherTip').value
      };

      fetch(API_URL, {
        method: "POST",
        mode: "no-cors", 
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify(payload)
      })
      .then(() => {
        btn.classList.remove('glowing-border-active');
        btn.disabled = false;
        btn.innerText = "[ CRAFT & SUBMIT REFLECTION ]";
        document.getElementById('checkinForm').reset();
        
        statusMsg.className = "mt-4 sm:mt-6 text-center text-[10px] sm:text-xs text-emerald-400 mc-font leading-relaxed opacity-100";
        statusMsg.innerText = "🎉 ADVANCEMENT MADE! REFLECTION CRAFTED!";
        statusMsg.classList.remove('hidden');

        fireConfetti();

        setTimeout(loadSpotlight, 1200);

        statusTimeout = setTimeout(() => {
          statusMsg.classList.add('opacity-0');
          setTimeout(() => statusMsg.classList.add('hidden'), 500);
        }, 5000);
      })
      .catch(err => {
        console.error(err);
        btn.classList.remove('glowing-border-active');
        btn.disabled = false;
        btn.innerText = "[ CRAFT & SUBMIT REFLECTION ]";
        statusMsg.className = "mt-4 sm:mt-6 text-center text-[10px] sm:text-xs text-red-400 mc-font leading-relaxed opacity-100";
        statusMsg.innerText = "❌ CRAFTING FAILED! TRY AGAIN!";
        statusMsg.classList.remove('hidden');

        statusTimeout = setTimeout(() => {
          statusMsg.classList.add('opacity-0');
          setTimeout(() => statusMsg.classList.add('hidden'), 500);
        }, 5000);
      });
    }

    function fireConfetti() {
      confetti({
        particleCount: 60,
        spread: 60,
        shapes: ['square'],
        colors: ['#10b981', '#f59e0b', '#ef4444', '#3b82f6', '#8b5cf6'],
        origin: { y: 0.6 }
      });
    }

    function loadSpotlight() {
      const container = document.getElementById('spotlightContainer');
      const shuffleBtn = document.getElementById('shuffleBtn');
      
      shuffleBtn.disabled = true;
      shuffleBtn.innerText = "⏳ SHUFFLING...";
      
      container.innerHTML = `
        <div class="py-6 text-center space-y-2">
          <div class="text-2xl sm:text-3xl pixel-spinner">⚙️</div>
          <p class="text-[10px] sm:text-xs text-yellow-300 mc-font">SHUFFLING THOUGHTS...</p>
        </div>
      `;
      
      fetch(API_URL)
        .then(res => res.json())
        .then(data => {
          shuffleBtn.disabled = false;
          shuffleBtn.innerText = "🔄 RESHUFFLE";

          if (!data) {
            container.innerHTML = '<p class="text-slate-400 text-center">No player notes found yet!</p>';
            return;
          }

          container.innerHTML = `
            <div class="p-3 sm:p-4 bg-stone-900 border-2 border-stone-700 space-y-1 break-words">
              <span class="text-[10px] sm:text-xs text-emerald-400 mc-font">💎 MAIN QUEST:</span>
              <p class="text-slate-200 text-lg sm:text-xl font-mono">"${data.goal.text}"</p>
              <span class="text-xs text-stone-500 block text-right">— Player: ${data.goal.name}</span>
            </div>

            <div class="p-3 sm:p-4 bg-stone-900 border-2 border-stone-700 space-y-1 break-words">
              <span class="text-[10px] sm:text-xs text-red-400 mc-font">💥 HAZARD WARNING:</span>
              <p class="text-slate-200 text-lg sm:text-xl font-mono">"${data.worry.text}"</p>
              <span class="text-xs text-stone-500 block text-right">— Player: ${data.worry.name}</span>
            </div>

            <div class="p-3 sm:p-4 bg-stone-900 border-2 border-stone-700 space-y-1 break-words">
              <span class="text-[10px] sm:text-xs text-sky-400 mc-font">🧪 TEACHER BUFF:</span>
              <p class="text-slate-200 text-lg sm:text-xl font-mono">"${data.tip.text}"</p>
              <span class="text-xs text-stone-500 block text-right">— Player: ${data.tip.name}</span>
            </div>
          `;
        })
        .catch(err => {
          shuffleBtn.disabled = false;
          shuffleBtn.innerText = "🔄 RESHUFFLE";
          console.error("Error fetching spotlight data:", err);
          container.innerHTML = '<p class="text-red-400 text-center text-[10px] sm:text-xs mc-font">FAILED TO LOAD REFLECTIONS</p>';
        });
    }

    window.onload = function() {
      initializeTitleSpans();
      startTitleColorLoop();
      loadSpotlight();
    };
  </script>
</body>
</html>
