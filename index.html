<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Class Reflections & Realm Quests</title>
  
  <!-- Enhanced Retro Pixel Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;600;700&family=VT323&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Canvas Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --mc-dark-border: #141414;
      --mc-light-border: #4a4a4a;
      --mc-gold: #fbc02d;
    }

    body {
      font-family: 'Pixelify Sans', cursive, sans-serif;
      font-size: 1.2rem;
      background-color: #0a0b0e;
      overflow-x: hidden;
      color: #e2e8f0;
    }

    /* Vibrant Minecraft Ambient Canvas */
    #bgCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      pointer-events: none;
    }

    h1, h2, label, button, .mc-font {
      font-family: 'Press Start 2P', cursive;
      letter-spacing: 0.5px;
    }

    /* Enhanced Minecraft Beveled Borders */
    .mc-box {
      background-color: rgba(38, 36, 35, 0.93);
      border: 4px solid #000;
      box-shadow: 
        inset 4px 4px 0px #3d3a37,
        inset -4px -4px 0px #171615,
        0 10px 25px -5px rgba(0, 0, 0, 0.85);
      position: relative;
    }

    .mc-slot {
      background-color: #121111;
      border: 3px solid #000;
      box-shadow: 
        inset -3px -3px 0px #32302e,
        inset 3px 3px 0px #0a0909;
      transition: all 0.25s ease-in-out;
    }

    /* Smooth Label Transition */
    .field-label {
      transition: all 0.25s ease-in-out;
    }

    /* ========================================================
       DYNAMIC INPUT & LABEL GLOWS ON CLICK / FOCUS
       ======================================================== */

    /* 1. Gamertag - Yellow Glow */
    .field-group-gamertag:focus-within .field-label {
      color: #facc15 !important;
      text-shadow: 0 0 12px rgba(250, 204, 21, 0.9), 0 0 20px rgba(250, 204, 21, 0.5), 2px 2px 0px #000;
      transform: translateX(4px);
    }
    .field-group-gamertag:focus-within .mc-slot {
      box-shadow: 
        inset -3px -3px 0px #121111,
        inset 3px 3px 0px #0a0909,
        0 0 20px rgba(250, 204, 21, 0.85);
      border-color: #facc15;
    }

    /* 2. Main Quest - Emerald Green Glow */
    .field-group-quest:focus-within .field-label {
      color: #34d399 !important;
      text-shadow: 0 0 12px rgba(52, 211, 153, 0.9), 0 0 20px rgba(16, 185, 129, 0.5), 2px 2px 0px #000;
      transform: translateX(4px);
    }
    .field-group-quest:focus-within .mc-slot {
      box-shadow: 
        inset -3px -3px 0px #121111,
        inset 3px 3px 0px #0a0909,
        0 0 20px rgba(16, 185, 129, 0.85);
      border-color: #10b981;
    }

    /* 3. Hazard Warning - Redstone Glow */
    .field-group-hazard:focus-within .field-label {
      color: #f87171 !important;
      text-shadow: 0 0 12px rgba(248, 113, 113, 0.9), 0 0 20px rgba(239, 68, 68, 0.5), 2px 2px 0px #000;
      transform: translateX(4px);
    }
    .field-group-hazard:focus-within .mc-slot {
      box-shadow: 
        inset -3px -3px 0px #121111,
        inset 3px 3px 0px #0a0909,
        0 0 20px rgba(239, 68, 68, 0.85);
      border-color: #ef4444;
    }

    /* 4. Teacher Buff - Diamond Cyan Glow */
    .field-group-buff:focus-within .field-label {
      color: #38bdf8 !important;
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.9), 0 0 20px rgba(56, 189, 248, 0.5), 2px 2px 0px #000;
      transform: translateX(4px);
    }
    .field-group-buff:focus-within .mc-slot {
      box-shadow: 
        inset -3px -3px 0px #121111,
        inset 3px 3px 0px #0a0909,
        0 0 20px rgba(56, 189, 248, 0.85);
      border-color: #38bdf8;
    }

    /* Action Buttons */
    .mc-button {
      background-color: #059669;
      border: 3px solid #000;
      box-shadow: 
        inset -3px -3px 0px #047857,
        inset 3px 3px 0px #34d399,
        0 4px 0px #000;
      text-shadow: 2px 2px 0px #000;
      transition: all 0.1s ease;
      position: relative;
      overflow: visible;
    }

    .mc-button:hover {
      background-color: #10b981;
      transform: translateY(-2px);
      box-shadow: 
        inset -3px -3px 0px #059669,
        inset 3px 3px 0px #6ee7b7,
        0 6px 0px #000;
    }

    .mc-button:active {
      transform: translateY(2px);
      box-shadow: 
        inset 3px 3px 0px #047857,
        inset -3px -3px 0px #34d399,
        0 2px 0px #000;
    }

    .mc-button-secondary {
      background-color: #475569;
      box-shadow: 
        inset -3px -3px 0px #334155,
        inset 3px 3px 0px #94a3b8,
        0 4px 0px #000;
    }
    
    .mc-button-secondary:hover {
      background-color: #64748b;
      box-shadow: 
        inset -3px -3px 0px #475569,
        inset 3px 3px 0px #cbd5e1,
        0 6px 0px #000;
    }

    /* Ultra-Smooth Plasma Beam */
    .perimeter-runner {
      position: absolute;
      inset: -5px;
      pointer-events: none;
      display: none;
      overflow: hidden;
      border-radius: 4px;
    }

    .submitting .perimeter-runner {
      display: block;
    }

    .plasma-rotator {
      position: absolute;
      inset: -200%;
      background: conic-gradient(
        from 0deg,
        transparent 0deg,
        transparent 210deg,
        #ff0055 240deg,
        #ff5500 280deg,
        #ffee00 330deg,
        #ffffff 350deg,
        #ffffff 360deg
      );
      animation: rotatePlasma 0.95s linear infinite;
      will-change: transform;
      filter: drop-shadow(0 0 8px #ffee00) drop-shadow(0 0 16px #ff3300) drop-shadow(0 0 24px #ff0055);
    }

    .plasma-mask {
      position: absolute;
      inset: 4px;
      background-color: rgba(5, 150, 105, 0.95);
      border-radius: 2px;
      z-index: 1;
    }

    @keyframes rotatePlasma {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .plasma-spark-container {
      position: absolute;
      inset: -2px;
      pointer-events: none;
      z-index: 2;
    }

    .spark {
      position: absolute;
      width: 7px;
      height: 7px;
      background: #ffffff;
      box-shadow: 0 0 10px #ffee00, 0 0 18px #ff4500;
      offset-path: rect(0% 100% 100% 0% round 0px);
      will-change: transform, opacity;
      animation: runSpark 0.95s linear infinite, flashPulse 0.2s ease-in-out infinite alternate;
    }

    .spark-1 { animation-delay: 0s, 0s; }
    .spark-2 { animation-delay: -0.24s, -0.05s; }
    .spark-3 { animation-delay: -0.48s, -0.1s; }
    .spark-4 { animation-delay: -0.72s, -0.15s; }

    @keyframes runSpark {
      0% { offset-distance: 0%; }
      100% { offset-distance: 100%; }
    }

    @keyframes flashPulse {
      0% { transform: scale(0.9); opacity: 0.7; }
      100% { transform: scale(1.6); opacity: 1; box-shadow: 0 0 14px #ffffff, 0 0 22px #ffdd00, 0 0 30px #ff0044; }
    }

    /* Text & Input Enhancements */
    input, textarea {
      font-family: 'Pixelify Sans', sans-serif !important;
      font-size: 1.25rem !important;
      color: #f8fafc !important;
      text-shadow: 1px 1px 0px #000;
    }

    input:focus, textarea:focus {
      outline: none;
    }

    .pixel-text-shadow {
      text-shadow: 2px 2px 0px #000;
    }

    .glow-gold {
      text-shadow: 0 0 8px rgba(251, 192, 45, 0.6), 2px 2px 0px #000;
    }

    /* Dynamic Color Loop Span */
    .colored-letter {
      display: inline-block;
      text-shadow: 2px 2px 0px #000;
      transition: color 0.25s ease-in-out;
      will-change: color;
    }

    /* Animations */
    @keyframes pixelFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    .float-icon {
      display: inline-block;
      animation: pixelFloat 2s ease-in-out infinite;
      flex-shrink: 0;
    }

    @keyframes fastSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .pixel-spinner {
      display: inline-block;
      animation: fastSpin 1s linear infinite;
    }
  </style>
</head>
<body class="py-4 sm:py-10 px-2 sm:px-6">

  <!-- Glowing Minecraft Particle Background Canvas -->
  <canvas id="bgCanvas"></canvas>

  <div class="max-w-2xl mx-auto space-y-5 sm:space-y-8 relative z-10">
    
    <!-- Banner Header -->
    <header class="text-center">
      <div class="bg-gradient-to-b from-emerald-800 to-emerald-950 mc-box p-3 sm:p-6 rounded-none w-full border-b-8">
        <!-- Flex Container for Mobile Title Alignment -->
        <h1 class="flex items-center justify-center gap-1.5 sm:gap-3 text-[11px] sm:text-lg md:text-2xl font-bold tracking-tight sm:tracking-wider whitespace-nowrap">
          <span class="float-icon text-sm sm:text-xl md:text-2xl">⛏️</span> 
          <span id="randomTitle">CLASS REFLECTIONS</span> 
          <span class="float-icon text-sm sm:text-xl md:text-2xl" style="animation-delay: 0.5s;">💎</span>
        </h1>
        <p class="text-emerald-200 text-sm sm:text-xl mt-1.5 sm:mt-2 font-semibold tracking-wide pixel-text-shadow">
          Build your quest goals & craft your school year!
        </p>
      </div>
    </header>

    <!-- Main Reflection Form -->
    <main class="mc-box p-4 sm:p-8 shadow-2xl">
      <form id="checkinForm" onsubmit="handleFormSubmit(event)" class="space-y-5 sm:space-y-6">
        
        <!-- Gamertag / Name -->
        <div class="space-y-1.5 sm:space-y-2 field-group-gamertag">
          <label class="block text-[10px] sm:text-xs text-yellow-400 leading-relaxed field-label pixel-text-shadow">
            🏷️ GAMERTAG / NAME:
          </label>
          <div class="mc-slot p-1">
            <input type="text" id="studentName" required 
              onfocus="playClickSound()"
              class="w-full px-3 py-2 bg-stone-900 border-2 border-stone-700 text-yellow-300"
              placeholder="e.g., Steve_99 or Alex">
          </div>
        </div>

        <!-- Quest Goal -->
        <div class="space-y-1.5 sm:space-y-2 field-group-quest">
          <label class="block text-[10px] sm:text-xs text-emerald-400 leading-relaxed field-label pixel-text-shadow">
            💎 1. MAIN QUEST: WHAT IS ONE BIG GOAL YOU WANT TO ACHIEVE THIS YEAR?
          </label>
          <div class="mc-slot p-1">
            <textarea id="goal" rows="3" required 
              onfocus="playClickSound()"
              class="w-full px-3 py-2 bg-stone-900 border-2 border-stone-700 text-emerald-300"
              placeholder="My main quest is to..."></textarea>
          </div>
        </div>

        <!-- Worry / Hazard -->
        <div class="space-y-1.5 sm:space-y-2 field-group-hazard">
          <label class="block text-[10px] sm:text-xs text-red-400 leading-relaxed field-label pixel-text-shadow">
            💥 2. HAZARD WARNING: WHAT IS ONE THING WEIGHING ON YOUR MIND?
          </label>
          <div class="mc-slot p-1">
            <textarea id="worry" rows="3" required 
              onfocus="playClickSound()"
              class="w-full px-3 py-2 bg-stone-900 border-2 border-stone-700 text-red-300"
              placeholder="I'm worried about..."></textarea>
          </div>
        </div>

        <!-- Teacher Advice / Buff -->
        <div class="space-y-1.5 sm:space-y-2 field-group-buff">
          <label class="block text-[10px] sm:text-xs text-sky-400 leading-relaxed field-label pixel-text-shadow">
            🧪 3. TEACHER BUFFS: WHAT CAN TEACHERS DO TO HELP YOU CRAFT SUCCESS?
          </label>
          <div class="mc-slot p-1">
            <textarea id="teacherTip" rows="3" required 
              onfocus="playClickSound()"
              class="w-full px-3 py-2 bg-stone-900 border-2 border-stone-700 text-sky-300"
              placeholder="Teachers can help by..."></textarea>
          </div>
        </div>

        <!-- Submit Button with Traveling Perimeter Beam -->
        <div class="pt-2">
          <button type="submit" id="submitBtn" onclick="playClickSound()"
            class="w-full py-3.5 sm:py-4 text-white font-bold text-[10px] sm:text-xs mc-button cursor-pointer leading-normal tracking-wider">
            <span class="relative z-10">[ CRAFT & SUBMIT REFLECTION ]</span>
            
            <!-- Ultra-Smooth Burning Plasma Beam -->
            <div class="perimeter-runner">
              <div class="plasma-rotator"></div>
              <div class="plasma-mask"></div>

              <!-- Floating Spark Specks -->
              <div class="plasma-spark-container">
                <div class="spark spark-1"></div>
                <div class="spark spark-2"></div>
                <div class="spark spark-3"></div>
                <div class="spark spark-4"></div>
              </div>
            </div>
          </button>
        </div>
      </form>
      
      <!-- Auto-fading Status Message -->
      <div id="statusMessage" class="hidden mt-6 text-center text-xs mc-font transition-opacity duration-500 glow-gold"></div>
    </main>

    <!-- Community Billboard / Spotlight -->
    <section class="mc-box p-4 sm:p-8 space-y-4 sm:space-y-5">
      <div class="flex flex-col sm:flex-row items-center justify-between border-b-4 border-stone-700 pb-4 gap-3 sm:gap-4">
        <div class="text-center sm:text-left">
          <h2 class="text-xs sm:text-base font-bold text-yellow-400 glow-gold">📜 REALM BULLETIN</h2>
          <p class="text-stone-300 text-sm sm:text-base mt-1 font-semibold">Insights shared by fellow players!</p>
        </div>
        <button id="shuffleBtn" onclick="playClickSound(); loadSpotlight();" 
          class="w-full sm:w-auto px-5 py-2.5 text-[10px] sm:text-xs text-yellow-300 mc-button mc-button-secondary mc-font">
          🔄 RESHUFFLE
        </button>
      </div>

      <div id="spotlightContainer" class="space-y-4">
        <p class="text-stone-400 text-center italic">Craft your entry above to display on the board!</p>
      </div>
    </section>

  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbztNuhGhOYB-9xb34sz3tT2kgZGj53bP3-ZT8bfCZzABfJAxJq9Bi4y3Lm4LlpDsIJT/exec";
    let statusTimeout;

    // --- Web Audio Synthesizer (Retro Sound Generator) ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new AudioContext();
      }
    }

    function playClickSound() {
      initAudio();
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      osc.type = 'square';
      osc.frequency.setValueAtTime(400, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.08);
      
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      
      osc.start();
      osc.stop(audioCtx.currentTime + 0.08);
    }

    function playLevelUpSound() {
      initAudio();
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99];
      notes.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + (i * 0.07));
        
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime + (i * 0.07));
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + (i * 0.07) + 0.15);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.start(audioCtx.currentTime + (i * 0.07));
        osc.stop(audioCtx.currentTime + (i * 0.07) + 0.15);
      });
    }

    // Palette for Title Dynamic Animation
    const pixelColors = [
      '#fde047', '#f43f5e', '#38bdf8', '#4ade80', 
      '#fb923c', '#a855f7', '#f472b6', '#34d399'
    ];

    function initializeTitleSpans() {
      const titleEl = document.getElementById('randomTitle');
      const text = titleEl.innerText;
      titleEl.innerHTML = '';

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        if (char === ' ') {
          titleEl.appendChild(document.createTextNode(' '));
        } else {
          const span = document.createElement('span');
          span.className = 'colored-letter';
          span.innerText = char;
          span.style.color = pixelColors[Math.floor(Math.random() * pixelColors.length)];
          titleEl.appendChild(span);
        }
      }
    }

    function startTitleColorLoop() {
      setInterval(() => {
        const spans = document.querySelectorAll('#randomTitle .colored-letter');
        spans.forEach(span => {
          const randomColor = pixelColors[Math.floor(Math.random() * pixelColors.length)];
          span.style.color = randomColor;
        });
      }, 500);
    }

    // --- High-Efficiency Minecraft Glow Particle Engine ---
    function initBackgroundCanvas() {
      const canvas = document.getElementById('bgCanvas');
      const ctx = canvas.getContext('2d');
      let width = canvas.width = window.innerWidth;
      let height = canvas.height = window.innerHeight;

      // Authentic Minecraft Glow Colors
      const glowPalettes = [
        { r: 74, g: 222, b: 128 },  // XP Emerald Green
        { r: 251, g: 191, b: 36 },  // Redstone Gold
        { r: 56, g: 189, b: 248 },  // Diamond Cyan
        { r: 192, g: 132, b: 252 }  // Enchanting Purple
      ];

      const PARTICLE_COUNT = 30;
      const particles = Array.from({ length: PARTICLE_COUNT }, () => createParticle(true));

      function createParticle(randomizeY = false) {
        const color = glowPalettes[Math.floor(Math.random() * glowPalettes.length)];
        return {
          x: Math.random() * width,
          y: randomizeY ? Math.random() * height : height + 20,
          size: Math.random() * 4 + 3,
          glowRadius: Math.random() * 18 + 12,
          speedY: -(Math.random() * 0.6 + 0.25),
          driftX: (Math.random() - 0.5) * 0.3,
          color: color,
          alpha: Math.random() * 0.6 + 0.3,
          pulseSpeed: Math.random() * 0.03 + 0.01,
          pulseAngle: Math.random() * Math.PI * 2
        };
      }

      function animate() {
        ctx.clearRect(0, 0, width, height);
        ctx.globalCompositeOperation = 'lighter';

        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];
          
          p.y += p.speedY;
          p.x += p.driftX;
          p.pulseAngle += p.pulseSpeed;

          const currentAlpha = Math.max(0.15, Math.min(1, p.alpha + Math.sin(p.pulseAngle) * 0.25));

          if (p.y < -30 || p.x < -20 || p.x > width + 20) {
            particles[i] = createParticle(false);
            continue;
          }

          const ix = Math.floor(p.x);
          const iy = Math.floor(p.y);

          const gradient = ctx.createRadialGradient(ix, iy, 0, ix, iy, p.glowRadius);
          gradient.addColorStop(0, `rgba(${p.color.r}, ${p.color.g}, ${p.color.b}, ${currentAlpha * 0.8})`);
          gradient.addColorStop(0.5, `rgba(${p.color.r}, ${p.color.g}, ${p.color.b}, ${currentAlpha * 0.25})`);
          gradient.addColorStop(1, `rgba(${p.color.r}, ${p.color.g}, ${p.color.b}, 0)`);

          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(ix, iy, p.glowRadius, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = `rgba(255, 255, 255, ${currentAlpha})`;
          ctx.fillRect(ix - Math.floor(p.size / 2), iy - Math.floor(p.size / 2), p.size, p.size);
        }

        ctx.globalCompositeOperation = 'source-over';
        requestAnimationFrame(animate);
      }

      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      animate();
    }

    function handleFormSubmit(event) {
      event.preventDefault();
      
      const btn = document.getElementById('submitBtn');
      const statusMsg = document.getElementById('statusMessage');
      
      clearTimeout(statusTimeout);

      btn.disabled = true;
      btn.querySelector('span').innerText = "[ CRAFTING RESPONSE... ]";
      btn.classList.add('submitting');

      const payload = {
        studentName: document.getElementById('studentName').value,
        goal: document.getElementById('goal').value,
        worry: document.getElementById('worry').value,
        teacherTip: document.getElementById('teacherTip').value
      };

      fetch(API_URL, {
        method: "POST",
        mode: "no-cors", 
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      })
      .then(() => {
        btn.classList.remove('submitting');
        btn.disabled = false;
        btn.querySelector('span').innerText = "[ CRAFT & SUBMIT REFLECTION ]";
        document.getElementById('checkinForm').reset();
        
        statusMsg.className = "mt-6 text-center text-xs text-emerald-400 mc-font leading-relaxed opacity-100 glow-gold";
        statusMsg.innerText = "🎉 ADVANCEMENT MADE! REFLECTION CRAFTED!";
        statusMsg.classList.remove('hidden');

        fireConfetti();
        playLevelUpSound();
        setTimeout(loadSpotlight, 1200);

        statusTimeout = setTimeout(() => {
          statusMsg.classList.add('opacity-0');
          setTimeout(() => statusMsg.classList.add('hidden'), 500);
        }, 5000);
      })
      .catch(err => {
        console.error(err);
        btn.classList.remove('submitting');
        btn.disabled = false;
        btn.querySelector('span').innerText = "[ CRAFT & SUBMIT REFLECTION ]";
        statusMsg.className = "mt-6 text-center text-xs text-red-400 mc-font leading-relaxed opacity-100";
        statusMsg.innerText = "❌ CRAFTING FAILED! TRY AGAIN!";
        statusMsg.classList.remove('hidden');

        statusTimeout = setTimeout(() => {
          statusMsg.classList.add('opacity-0');
          setTimeout(() => statusMsg.classList.add('hidden'), 500);
        }, 5000);
      });
    }

    function fireConfetti() {
      confetti({
        particleCount: 70,
        spread: 70,
        shapes: ['square'],
        colors: ['#10b981', '#f59e0b', '#ef4444', '#3b82f6', '#8b5cf6'],
        origin: { y: 0.6 }
      });
    }

    function loadSpotlight() {
      const container = document.getElementById('spotlightContainer');
      const shuffleBtn = document.getElementById('shuffleBtn');
      
      shuffleBtn.disabled = true;
      shuffleBtn.innerText = "⏳ SHUFFLING...";
      
      container.innerHTML = `
        <div class="py-8 text-center space-y-3">
          <div class="text-3xl pixel-spinner">⚙️</div>
          <p class="text-xs text-yellow-300 mc-font glow-gold">SHUFFLING THOUGHTS...</p>
        </div>
      `;
      
      fetch(API_URL)
        .then(res => res.json())
        .then(data => {
          shuffleBtn.disabled = false;
          shuffleBtn.innerText = "🔄 RESHUFFLE";

          if (!data) {
            container.innerHTML = '<p class="text-stone-400 text-center">No player notes found yet!</p>';
            return;
          }

          container.innerHTML = `
            <div class="mc-slot p-4 space-y-2 border-l-4 border-l-emerald-500">
              <span class="text-xs text-emerald-400 mc-font pixel-text-shadow">💎 MAIN QUEST:</span>
              <p class="text-slate-100 text-lg sm:text-xl leading-relaxed">"${data.goal.text}"</p>
              <span class="text-sm text-stone-400 block text-right font-semibold">— Player: ${data.goal.name}</span>
            </div>

            <div class="mc-slot p-4 space-y-2 border-l-4 border-l-red-500">
              <span class="text-xs text-red-400 mc-font pixel-text-shadow">💥 HAZARD WARNING:</span>
              <p class="text-slate-100 text-lg sm:text-xl leading-relaxed">"${data.worry.text}"</p>
              <span class="text-sm text-stone-400 block text-right font-semibold">— Player: ${data.worry.name}</span>
            </div>

            <div class="mc-slot p-4 space-y-2 border-l-4 border-l-sky-500">
              <span class="text-xs text-sky-400 mc-font pixel-text-shadow">🧪 TEACHER BUFF:</span>
              <p class="text-slate-100 text-lg sm:text-xl leading-relaxed">"${data.tip.text}"</p>
              <span class="text-sm text-stone-400 block text-right font-semibold">— Player: ${data.tip.name}</span>
            </div>
          `;
        })
        .catch(err => {
          shuffleBtn.disabled = false;
          shuffleBtn.innerText = "🔄 RESHUFFLE";
          console.error("Error fetching spotlight data:", err);
          container.innerHTML = '<p class="text-red-400 text-center text-xs mc-font">FAILED TO LOAD REFLECTIONS</p>';
        });
    }

    window.onload = function() {
      initializeTitleSpans();
      startTitleColorLoop();
      initBackgroundCanvas();
      loadSpotlight();
    };
  </script>
</body>
</html>
