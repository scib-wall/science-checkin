<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Science Class Reflections & Vibes</title>
  
  <!-- Friendly Google Fonts: Fredoka & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Canvas Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    h1, h2, button, .heading-font {
      font-family: 'Fredoka', sans-serif;
    }

    /* Animated Glowing Border Keyframes */
    @keyframes borderGlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Running glowing border wrapper class */
    .glowing-border-active {
      position: relative;
      background: linear-gradient(90deg, #3b82f6, #ec4899, #8b5cf6, #10b981, #3b82f6);
      background-size: 300% 300%;
      animation: borderGlow 2s ease infinite;
      padding: 3px;
      border-radius: 1rem;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen py-10 px-4">

  <div class="max-w-2xl mx-auto space-y-8">
    
    <!-- Friendly & Informal Header -->
    <header class="text-center space-y-3">
      <h1 class="text-4xl sm:text-5xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-teal-300 via-sky-300 to-indigo-300 tracking-wide">
        🧪 Science Class Reflections & Vibes 🚀
      </h1>
      <p class="text-slate-300 text-base sm:text-lg">Take a moment to pause, reflect, and share your thoughts for the school year!</p>
    </header>

    <!-- Reflection Form Section -->
    <main class="bg-slate-800/80 backdrop-blur border border-slate-700/60 rounded-3xl p-6 sm:p-8 shadow-2xl">
      <form id="checkinForm" onsubmit="handleFormSubmit(event)" class="space-y-6">
        
        <!-- Name -->
        <div>
          <label class="block text-sm font-semibold text-slate-200 mb-2">What should we call you? (Name / Nickname)</label>
          <input type="text" id="studentName" required 
            class="w-full px-4 py-3 rounded-2xl bg-slate-900/80 border border-slate-700 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-teal-400 transition"
            placeholder="e.g. Alex or StarGazer22">
        </div>

        <!-- Question 1 -->
        <div>
          <label class="block text-sm font-semibold text-teal-300 mb-2">🌱 1. Looking ahead, what's one big (or small!) goal you hope to achieve this year?</label>
          <textarea id="goal" rows="3" required 
            class="w-full px-4 py-3 rounded-2xl bg-slate-900/80 border border-slate-700 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-teal-400 transition"
            placeholder="I really hope to..."></textarea>
        </div>

        <!-- Question 2 -->
        <div>
          <label class="block text-sm font-semibold text-amber-300 mb-2">💭 2. Honest moment: What's one thing weighing on your mind or worrying you right now?</label>
          <textarea id="worry" rows="3" required 
            class="w-full px-4 py-3 rounded-2xl bg-slate-900/80 border border-slate-700 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-amber-400 transition"
            placeholder="Honestly, I'm a bit nervous about..."></textarea>
        </div>

        <!-- Question 3 -->
        <div>
          <label class="block text-sm font-semibold text-indigo-300 mb-2">💡 3. What is something your science teachers can do to make learning feel engaging and supported for you?</label>
          <textarea id="teacherTip" rows="3" required 
            class="w-full px-4 py-3 rounded-2xl bg-slate-900/80 border border-slate-700 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-400 transition"
            placeholder="It makes a huge difference when teachers..."></textarea>
        </div>

        <!-- Submit Button Container (for running glowing border effect) -->
        <div id="btnWrapper" class="transition-all duration-300 rounded-2xl">
          <button type="submit" id="submitBtn" 
            class="w-full py-4 bg-gradient-to-r from-teal-400 to-sky-400 hover:from-teal-300 hover:to-sky-300 text-slate-950 font-bold text-lg rounded-2xl transition duration-200 shadow-lg shadow-teal-500/20 active:scale-[0.99]">
            Share My Reflections ✨
          </button>
        </div>
      </form>
      
      <!-- Status Message -->
      <div id="statusMessage" class="hidden mt-4 text-center text-lg font-semibold heading-font"></div>
    </main>

    <!-- Class Spotlight / Peer Reflections -->
    <section class="bg-slate-800/80 backdrop-blur border border-slate-700/60 rounded-3xl p-6 sm:p-8 shadow-2xl space-y-6">
      <div class="flex items-center justify-between border-b border-slate-700/60 pb-4">
        <div>
          <h2 class="text-2xl font-bold text-amber-300">✨ Classmates' Reflections</h2>
          <p class="text-xs text-slate-400">See what others are thinking and hoping for this year!</p>
        </div>
        <button onclick="loadSpotlight()" 
          class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-xl text-sm font-medium transition active:scale-95">
          🎲 Shuffle Thoughts
        </button>
      </div>

      <div id="spotlightContainer" class="space-y-4">
        <p class="text-slate-400 text-center italic">Share your thoughts above to join the class wall!</p>
      </div>
    </section>

  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbztNuhGhOYB-9xb34sz3tT2kgZGj53bP3-ZT8bfCZzABfJAxJq9Bi4y3Lm4LlpDsIJT/exec";

    function handleFormSubmit(event) {
      event.preventDefault();
      
      const btn = document.getElementById('submitBtn');
      const btnWrapper = document.getElementById('btnWrapper');
      const statusMsg = document.getElementById('statusMessage');
      
      // Start Glowing Border Animation & Disable Button
      btn.disabled = true;
      btn.innerText = "Sending your reflections...";
      btnWrapper.classList.add('glowing-border-active');

      const payload = {
        studentName: document.getElementById('studentName').value,
        goal: document.getElementById('goal').value,
        worry: document.getElementById('worry').value,
        teacherTip: document.getElementById('teacherTip').value
      };

      fetch(API_URL, {
        method: "POST",
        mode: "no-cors", 
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify(payload)
      })
      .then(() => {
        // Stop glowing border animation
        btnWrapper.classList.remove('glowing-border-active');
        btn.disabled = false;
        btn.innerText = "Share My Reflections ✨";
        document.getElementById('checkinForm').reset();
        
        // Show Success Status
        statusMsg.className = "mt-4 text-center text-teal-300 text-lg font-bold";
        statusMsg.innerText = "🎉 Reflections received! Thanks for sharing!";
        statusMsg.classList.remove('hidden');

        // Trigger Confetti Animation 🎉
        fireConfetti();

        // Refresh spotlights
        setTimeout(loadSpotlight, 1500);
      })
      .catch(err => {
        console.error(err);
        btnWrapper.classList.remove('glowing-border-active');
        btn.disabled = false;
        btn.innerText = "Share My Reflections ✨";
        statusMsg.className = "mt-4 text-center text-rose-400 font-semibold";
        statusMsg.innerText = "❌ Uh oh, something went wrong. Please try again!";
        statusMsg.classList.remove('hidden');
      });
    }

    function fireConfetti() {
      // Confetti burst from both sides
      confetti({
        particleCount: 80,
        spread: 70,
        origin: { y: 0.6 }
      });
    }

    function loadSpotlight() {
      const container = document.getElementById('spotlightContainer');
      
      fetch(API_URL)
        .then(res => res.json())
        .then(data => {
          if (!data) {
            container.innerHTML = '<p class="text-slate-400 text-center">No reflections posted yet. Be the first!</p>';
            return;
          }

          container.innerHTML = `
            <div class="p-4 bg-slate-900/90 rounded-2xl border border-slate-700/50 space-y-1">
              <span class="text-xs font-bold text-teal-400 uppercase tracking-wider">🌱 Yearly Goal</span>
              <p class="text-slate-200 font-medium text-sm sm:text-base">"${data.goal.text}"</p>
              <span class="text-xs text-slate-400 block pt-1">— ${data.goal.name}</span>
            </div>

            <div class="p-4 bg-slate-900/90 rounded-2xl border border-slate-700/50 space-y-1">
              <span class="text-xs font-bold text-amber-400 uppercase tracking-wider">💭 Mindset / Worry</span>
              <p class="text-slate-200 font-medium text-sm sm:text-base">"${data.worry.text}"</p>
              <span class="text-xs text-slate-400 block pt-1">— ${data.worry.name}</span>
            </div>

            <div class="p-4 bg-slate-900/90 rounded-2xl border border-slate-700/50 space-y-1">
              <span class="text-xs font-bold text-indigo-400 uppercase tracking-wider">💡 Advice for Teachers</span>
              <p class="text-slate-200 font-medium text-sm sm:text-base">"${data.tip.text}"</p>
              <span class="text-xs text-slate-400 block pt-1">— ${data.tip.name}</span>
            </div>
          `;
        })
        .catch(err => {
          console.error("Error fetching spotlight data:", err);
        });
    }

    window.onload = loadSpotlight;
  </script>
</body>
</html>
